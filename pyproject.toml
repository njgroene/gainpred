[project]
name = "gainpred"
version = "0.1.0"
description = "Self-improvement experiments on easy-to-hard generalisation (see docs/protocol.md)"
requires-python = ">=3.12"
dependencies = [
    "modal>=1.6.4",
    "numpy>=2.5.4",
    "torch>=2.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gainpred"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains a model for a while (deselect with -m 'not slow')"]
